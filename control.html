<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sala de control · Vigía HSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Consola de una columna: semáforo arriba (lo más usado), alerta, pantallas y bitácora */
  :root{
    --navy:#0A1D4E; --navy3:#1E3A8A; --accent:#2563EB; --bg:#EEF2F8; --card:#FFFFFF; --ink:#0F1B33; --muted:#55627D; --line:#D5DDEA;
    --verde:#1F9D55; --amarilla:#F2B705; --roja:#D62828; --gris:#6B7280;
    --f:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --fc:"Barlow Condensed","Barlow",system-ui,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f)}
  header{background:var(--navy);color:#fff;padding-block:18px;padding-inline:20px}
  header .in,main{max-width:860px;margin:0 auto}
  header .k{font-family:var(--fc);font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:#B9C7E6}
  header h1{font-family:var(--fc);font-size:30px;margin:2px 0 0;text-transform:uppercase;letter-spacing:.02em}
  header .who{font-size:14px;color:#B9C7E6;margin-top:4px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  header button{font:inherit;font-size:13px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:3px 10px;cursor:pointer}
  main{padding-block:20px 40px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
  h2{font-family:var(--fc);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:0 0 12px;color:var(--navy)}
  label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
  input,textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  input:focus,textarea:focus,button:focus-visible{outline:3px solid rgba(37,99,235,.35);outline-offset:1px}
  .btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;background:var(--accent);color:#fff}
  .btn:disabled{opacity:.5;cursor:wait}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .err{color:var(--roja);font-weight:600;margin-top:10px;min-height:1.5em}
  .ok{color:var(--verde);font-weight:600}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  .now{display:flex;align-items:center;gap:16px;margin-bottom:16px}
  .luz{width:58px;height:58px;border-radius:50%;flex:none;background:var(--gris)}
  .now .e{font-family:var(--fc);font-size:34px;font-weight:800;text-transform:uppercase;line-height:1}
  .now .d{color:var(--muted);font-size:14px}
  .sem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .sem button{font-family:var(--fc);font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;border:3px solid transparent;border-radius:10px;
    padding:18px 8px;cursor:pointer;color:#fff;min-width:0}
  .sem .VERDE{background:var(--verde)} .sem .AMARILLA{background:var(--amarilla);color:#1B1300} .sem .ROJA{background:var(--roja)}
  .sem button.cur{box-shadow:inset 0 0 0 4px rgba(255,255,255,.75)}
  .sem button.armed{border-color:var(--ink);animation:pulse .8s ease-in-out infinite alternate}
  .sem small{display:block;font-family:var(--f);font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;margin-top:4px}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.03)}}
  .hint{color:var(--muted);font-size:14px;margin-top:10px}

  .alertaOn{background:#7A0E0E;color:#fff;border-radius:8px;padding:12px 14px;margin-bottom:10px;font-weight:600}
  .list{display:flex;flex-direction:column}
  .li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
  .li:first-child{border-top:0}
  .li .s{color:var(--muted);font-size:13px;grid-column:1/-1}
  .pill{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap;align-self:start}
  .pill.on{background:#DCF5E6;color:#14683A} .pill.off{background:#FDE2E2;color:#9B1C1C} .pill.never{background:#E5E7EB;color:#374151}
  #app{display:none}
  @media (max-width:520px){ .sem{grid-template-columns:1fr} }
  @media (prefers-reduced-motion:reduce){ .sem button.armed{animation:none} }
</style>
</head>
<body>
<header><div class="in">
  <div class="k" id="unidad">Vigía HSE</div>
  <h1>Sala de control</h1>
  <div class="who" id="who"></div>
</div></header>

<main>
  <section class="card" id="login">
    <h2>Ingresar</h2>
    <form id="fLogin">
      <label for="clave">Clave de la sala de control</label>
      <input id="clave" type="password" inputmode="numeric" autocomplete="current-password" required>
      <label for="quien">Tu nombre (queda en la bitácora)</label>
      <input id="quien" type="text" autocomplete="name" required>
      <div class="row" style="margin-top:14px">
        <button class="btn" id="bLogin" type="submit">Ingresar</button>
        <label style="margin:0;font-weight:500"><input id="rec" type="checkbox" checked style="width:auto"> Recordar en este equipo</label>
      </div>
      <div class="err" id="eLogin" role="alert"></div>
    </form>
  </section>

  <div id="app">
    <section class="card">
      <h2>Semáforo de tormenta eléctrica</h2>
      <div class="now"><div class="luz" id="luz"></div><div><div class="e" id="semE">—</div><div class="d" id="semD"></div></div></div>
      <div class="sem" id="sem">
        <button type="button" class="VERDE" data-e="VERDE">Verde<small>Toca dos veces</small></button>
        <button type="button" class="AMARILLA" data-e="AMARILLA">Amarilla<small>Toca dos veces</small></button>
        <button type="button" class="ROJA" data-e="ROJA">Roja<small>Toca dos veces</small></button>
      </div>
      <div class="hint">Las pantallas cambian en menos de 30 segundos. Esto complementa la sirena y la radio; no las reemplaza.</div>
      <div class="err" id="eSem" role="alert"></div>
    </section>

    <section class="card">
      <h2>Alerta urgente en todas las pantallas</h2>
      <div id="alertaNow"></div>
      <label for="alTxt">Texto de la alerta</label>
      <textarea id="alTxt" rows="3" maxlength="300" placeholder="Ej.: Sismo. Evacúe a la zona segura y espere instrucciones de su supervisor."></textarea>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="bAl" type="button" style="background:var(--roja)">Publicar alerta</button>
        <button class="btn ghost" id="bQuitar" type="button">Quitar alerta</button>
      </div>
      <div class="err" id="eAl" role="alert"></div>
    </section>

    <section class="card">
      <h2>Avisos por aprobar</h2>
      <div class="list" id="pend"></div>
      <div class="err" id="ePend" role="alert"></div>
    </section>

    <section class="card">
      <h2>Trabajadores laborando ahora</h2>
      <div class="row" style="align-items:flex-end">
        <div style="flex:1;min-width:140px"><label for="tProp">Personal propio</label><input id="tProp" type="text" inputmode="numeric" placeholder="Ej.: 1248"></div>
        <div style="flex:1;min-width:140px"><label for="tCont">Personal de contrata</label><input id="tCont" type="text" inputmode="numeric" placeholder="Ej.: 652"></div>
        <button class="btn" id="bTrab" type="button">Actualizar pantallas</button>
      </div>
      <div class="hint" id="tInfo"></div>
      <div class="err" id="eTrab" role="alert"></div>
    </section>

    <section class="card">
      <h2>Pantallas</h2>
      <div class="list" id="pant"></div>
    </section>

    <section class="card">
      <h2>Bitácora</h2>
      <div class="list" id="bit"></div>
    </section>
  </div>
</main>

<script src="config.js"></script>
<script>
var TZ = 'America/Lima';
function $(id){ return document.getElementById(id); }
function get(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
function set(k, v){ try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch(e){} }
function esc(s){ return String(s || '').replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function fecha(iso){
  if (!iso) return '';
  return new Date(iso).toLocaleString('es-PE', { timeZone:TZ, day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', hourCycle:'h23' });
}
var CLAVE = get('vigia_clave'), QUIEN = get('vigia_quien'), timer = null;

function post(body){
  body.clave = CLAVE; body.quien = QUIEN;
  return fetch(API, { method:'POST', body: JSON.stringify(body) }).then(function(r){ return r.json(); });
}

function render(d){
  $('unidad').textContent = 'Vigía HSE' + (d.unidad ? ' · ' + d.unidad : '');
  $('who').innerHTML = 'Operador: ' + esc(QUIEN) + ' <button type="button" id="salir">Salir</button>';
  $('salir').onclick = salir;
  var s = d.semaforo || {}, col = { VERDE:'var(--verde)', AMARILLA:'var(--amarilla)', ROJA:'var(--roja)' };
  $('luz').style.background = col[s.estado] || 'var(--gris)';
  $('semE').textContent = s.estado === 'VERDE' ? 'Verde' : s.estado === 'AMARILLA' ? 'Alerta amarilla' : 'Alerta roja';
  $('semD').textContent = (s.desde ? 'Desde ' + fecha(s.desde) + ' · ' : '') + (s.mensaje || '');
  Array.prototype.forEach.call($('sem').children, function(b){ b.classList.toggle('cur', b.getAttribute('data-e') === s.estado); });
  $('alertaNow').innerHTML = d.alerta ? '<div class="alertaOn">Activa desde ' + esc(fecha(d.alerta.desde)) + ': ' + esc(d.alerta.texto) + '</div>'
    : '<p class="ok" style="margin:0">Sin alerta urgente activa.</p>';
  $('bQuitar').style.display = d.alerta ? '' : 'none';
  var t = d.trabajadores;
  if (document.activeElement !== $('tProp') && document.activeElement !== $('tCont')) {
    $('tProp').value = t && t.propios !== null ? t.propios : '';
    $('tCont').value = t && t.contratas !== null ? t.contratas : '';
  }
  $('tInfo').textContent = t ? 'En pantalla: ' + Number(t.total).toLocaleString('es-PE') + ' trabajadores' + (t.desde ? ' · actualizado ' + fecha(t.desde) : '')
    : 'Sin dato: el bloque no aparece en las pantallas.';
  $('pend').innerHTML = (d.pendientes || []).map(function(p){
    return '<div class="li"><span><b>' + esc(p.titulo) + '</b></span><button class="btn" type="button" data-ap="' + esc(p.id) + '" style="padding:8px 14px">Aprobar</button>' +
      '<span class="s">' + esc([p.categoria, p.areas, p.autor ? 'por ' + p.autor : ''].filter(Boolean).join(' · ')) + '</span></div>';
  }).join('') || '<p class="hint" style="margin:0">No hay avisos esperando aprobación.</p>';
  $('pant').innerHTML = (d.pantallas || []).map(function(p){
    var cls = p.minutos === null ? 'never' : p.minutos <= 3 ? 'on' : 'off';
    var txt = p.minutos === null ? 'Nunca conectada' : p.minutos <= 3 ? 'En línea' : 'Sin señal ' + p.minutos + ' min';
    return '<div class="li"><span><b>' + esc(p.nombre) + '</b> · ' + esc(p.codigo) + '</span><span class="pill ' + cls + '">' + txt + '</span>' +
      (p.ultima ? '<span class="s">Última conexión ' + esc(fecha(p.ultima)) + '</span>' : '') + '</div>';
  }).join('') || '<p class="hint">No hay áreas en la hoja Áreas.</p>';
  $('bit').innerHTML = (d.bitacora || []).map(function(b){
    return '<div class="li"><span><b>' + esc(b.evento) + ':</b> ' + esc(b.valor) + '</span><span class="s" style="grid-column:auto">' + esc(fecha(b.fecha)) + '</span>' +
      '<span class="s">' + esc(b.quien) + ' · ' + esc(b.origen) + '</span></div>';
  }).join('') || '<p class="hint">Sin registros todavía.</p>';
}

function cargar(){
  return post({ accion:'estado' }).then(function(d){
    if (!d.ok) { if (/clave/i.test(d.error || '')) salir(d.error); return; }
    render(d);
  }).catch(function(){ $('eSem').textContent = 'Sin conexión con el backend. Reintentando…'; });
}

function entrar(){
  $('login').style.display = 'none';
  $('app').style.display = 'flex'; $('app').style.flexDirection = 'column'; $('app').style.gap = '16px';
  cargar();
  clearInterval(timer); timer = setInterval(cargar, 15000);
}
function salir(msg){
  clearInterval(timer);
  CLAVE = ''; set('vigia_clave', '');
  $('app').style.display = 'none'; $('login').style.display = '';
  $('who').textContent = '';
  $('eLogin').textContent = typeof msg === 'string' ? msg : '';
}

$('quien').value = QUIEN;
$('fLogin').addEventListener('submit', function(e){
  e.preventDefault();
  CLAVE = $('clave').value.trim(); QUIEN = $('quien').value.trim();
  $('bLogin').disabled = true; $('eLogin').textContent = '';
  post({ accion:'estado' }).then(function(d){
    $('bLogin').disabled = false;
    if (!d.ok) { $('eLogin').textContent = d.error || 'No se pudo ingresar.'; return; }
    set('vigia_quien', QUIEN);
    if ($('rec').checked) set('vigia_clave', CLAVE);
    render(d); entrar();
  }).catch(function(){ $('bLogin').disabled = false; $('eLogin').textContent = 'Sin conexión con el backend. Revisa internet.'; });
});

/* Semáforo: primer toque arma el botón, el segundo (antes de 5 s) confirma. */
var armed = null, armTimer = null;
Array.prototype.forEach.call($('sem').children, function(b){
  b.addEventListener('click', function(){
    var e = b.getAttribute('data-e');
    if (armed !== b) {
      if (armed) { armed.classList.remove('armed'); armed.querySelector('small').textContent = 'Toca dos veces'; }
      armed = b; b.classList.add('armed'); b.querySelector('small').textContent = 'Toca de nuevo para confirmar';
      clearTimeout(armTimer);
      armTimer = setTimeout(function(){ if (armed) { armed.classList.remove('armed'); armed.querySelector('small').textContent = 'Toca dos veces'; armed = null; } }, 5000);
      return;
    }
    clearTimeout(armTimer); b.classList.remove('armed'); b.querySelector('small').textContent = 'Enviando…'; armed = null;
    $('eSem').textContent = '';
    post({ accion:'semaforo', estado:e }).then(function(d){
      b.querySelector('small').textContent = 'Toca dos veces';
      if (!d.ok) { $('eSem').textContent = d.error; return; }
      render(d);
    }).catch(function(){ b.querySelector('small').textContent = 'Toca dos veces'; $('eSem').textContent = 'No se pudo enviar. Revisa internet y reintenta.'; });
  });
});

function enviarAlerta(texto, boton){
  $('eAl').textContent = '';
  boton.disabled = true;
  post({ accion:'alerta', texto:texto }).then(function(d){
    boton.disabled = false;
    if (!d.ok) { $('eAl').textContent = d.error; return; }
    if (texto) $('alTxt').value = '';
    render(d);
  }).catch(function(){ boton.disabled = false; $('eAl').textContent = 'No se pudo enviar. Revisa internet y reintenta.'; });
}
$('bAl').addEventListener('click', function(){
  var t = $('alTxt').value.trim();
  if (!t) { $('eAl').textContent = 'Escribe el texto de la alerta.'; return; }
  if ($('bAl').getAttribute('data-ok') !== '1') {
    $('bAl').setAttribute('data-ok', '1'); $('bAl').textContent = 'Confirmar: publicar en todas las pantallas';
    setTimeout(function(){ $('bAl').removeAttribute('data-ok'); $('bAl').textContent = 'Publicar alerta'; }, 6000);
    return;
  }
  $('bAl').removeAttribute('data-ok'); $('bAl').textContent = 'Publicar alerta';
  enviarAlerta(t, $('bAl'));
});
$('bQuitar').addEventListener('click', function(){ enviarAlerta('', $('bQuitar')); });

$('pend').addEventListener('click', function(e){
  var b = e.target.closest('button[data-ap]');
  if (!b) return;
  b.disabled = true; b.textContent = 'Aprobando…'; $('ePend').textContent = '';
  post({ accion:'aprobar', id:b.getAttribute('data-ap') }).then(function(d){
    if (!d.ok) { b.disabled = false; b.textContent = 'Aprobar'; $('ePend').textContent = d.error; return; }
    render(d);
  }).catch(function(){ b.disabled = false; b.textContent = 'Aprobar'; $('ePend').textContent = 'No se pudo enviar. Revisa internet y reintenta.'; });
});

$('bTrab').addEventListener('click', function(){
  $('eTrab').textContent = ''; $('bTrab').disabled = true;
  post({ accion:'trabajadores', propios:$('tProp').value.trim(), contratas:$('tCont').value.trim() }).then(function(d){
    $('bTrab').disabled = false;
    if (!d.ok) { $('eTrab').textContent = d.error; return; }
    render(d);
  }).catch(function(){ $('bTrab').disabled = false; $('eTrab').textContent = 'No se pudo enviar. Revisa internet y reintenta.'; });
});

if (CLAVE && QUIEN) entrar();
</script>
</body>
</html>
